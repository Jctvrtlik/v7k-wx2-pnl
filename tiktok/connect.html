<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKYE Social Reporting — Connection</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;max-width:640px;margin:0 auto;padding:28px 20px;color:#212121;line-height:1.55}
.card{border:1px solid #E5E4E2;border-radius:12px;padding:24px;margin-top:16px}
h1{color:#08123F;border-bottom:3px solid #DAA520;padding-bottom:8px;font-size:22px}
.ok{color:#375623;font-weight:bold;font-size:18px}
.err{color:#B00020;font-weight:bold}
label{display:block;font-weight:bold;color:#08123F;margin-top:14px}
textarea{width:100%;height:90px;font-family:monospace;font-size:13px;padding:10px;border:1px solid #A9A9A9;border-radius:8px;box-sizing:border-box}
button{background:#08123F;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:15px;margin-top:12px;cursor:pointer}
button:hover{background:#002366}
ol{padding-left:20px}li{margin:6px 0}
.step{background:#F7F7F9;border-radius:8px;padding:14px 16px;margin-top:16px}
small{color:#A9A9A9}
</style>
</head>
<body>
<h1>SKYE Social Reporting</h1>
<div id="content"></div>

<script>
(function(){
  var p = new URLSearchParams(window.location.search);
  var code = p.get('code');
  var scopes = p.get('scopes') || '';
  var err = p.get('error') || p.get('error_description');
  var c = document.getElementById('content');

  if (err) {
    c.innerHTML = '<div class="card"><p class="err">Something went wrong: ' +
      err.replace(/[<>]/g,'') + '</p><p>Please close this page, reopen the link, and try ' +
      'Authorize again. If it keeps happening, screenshot this page and send it to Joe.</p></div>';
    return;
  }

  if (!code) {
    c.innerHTML = '<div class="card"><p>This page is used during the one-time setup. ' +
      'Open the connect link Joe sent you while logged into a property account.</p></div>';
    return;
  }

  var payload = 'code=' + code + '\nscopes=' + scopes;
  c.innerHTML =
    '<div class="card">' +
      '<p class="ok">&#10003; This account connected successfully.</p>' +
      '<div class="step"><b>One quick thing to finish this account:</b>' +
        '<ol>' +
          '<li>Tap <b>Copy</b> below.</li>' +
          '<li>Send it to Joe <b>right away</b>, with the <b>property name</b> and the ' +
          '<b>@handle</b> you saw on the previous screen.</li>' +
        '</ol>' +
      '</div>' +
      '<label>Send this to Joe:</label>' +
      '<textarea id="box" readonly>' + payload + '</textarea>' +
      '<button onclick="(function(){var t=document.getElementById(\'box\');t.select();' +
        'document.execCommand(\'copy\');var b=event.target;b.textContent=\'Copied \\u2713\';' +
        'setTimeout(function(){b.textContent=\'Copy\';},2000);})()">Copy</button>' +
      '<p><small>Then log out, log into the next property, and open the link again. ' +
      'Do this promptly &mdash; the code above stops working after a few minutes.</small></p>' +
    '</div>';
})();
</script>
</body>
</html>
